<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe"/>
      <stop offset="100%" style="stop-color:#f7f5f0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="url(#bg)" rx="8"/>
  <rect x="40" y="20" width="620" height="440" fill="white" stroke="#c9b99a" stroke-width="1.5" rx="4"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e" letter-spacing="1">SEMI-FORMAL LETTER FORMAT</text>
  <line x1="80" y1="55" x2="620" y2="55" stroke="#c9b99a" stroke-width="0.5"/>
  <text x="80" y="80" font-size="11" fill="#7f8c8d">Your Address</text>
  <text x="80" y="95" font-size="10" fill="#95a5a6">123 Main Street, London</text>
  <text x="520" y="80" font-size="11" fill="#7f8c8d" text-anchor="end">Date</text>
  <text x="520" y="95" font-size="10" fill="#95a5a6" text-anchor="end">15 July 2026</text>
  <text x="80" y="125" font-size="11" fill="#7f8c8d">Recipient</text>
  <text x="80" y="140" font-size="10" fill="#95a5a6">Course Organizer, Training Institute</text>
  <text x="80" y="175" font-size="12" fill="#34495e" font-weight="bold">Dear [Name],</text>
  <rect x="80" y="195" width="540" height="50" fill="#f5f0e8" stroke="#c4a86a" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="215" font-size="11" fill="#7a6a3a" font-style="italic">Opening: Friendly but respectful tone</text>
  <text x="95" y="232" font-size="10" fill="#8a7a4a" font-style="italic">e.g., "I hope this letter finds you well" / "Thank you for..."</text>
  <rect x="80" y="255" width="540" height="65" fill="#e8f0f5" stroke="#6a9ab5" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="275" font-size="11" fill="#3a6a8a" font-style="italic">Body: Explain the situation with polite language</text>
  <text x="95" y="292" font-size="11" fill="#3a6a8a" font-style="italic">Use: "I would appreciate..." / "Could you please..."</text>
  <text x="95" y="309" font-size="11" fill="#3a6a8a" font-style="italic">"I was wondering if..." / "It would be helpful if..."</text>
  <rect x="80" y="330" width="540" height="45" fill="#f0f5e8" stroke="#8ab56a" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="350" font-size="11" fill="#4a7a2a" font-style="italic">Closing: Warm but professional</text>
  <text x="95" y="367" font-size="10" fill="#5a8a3a" font-style="italic">e.g., "Thank you for your time" / "I look forward to your reply"</text>
  <text x="80" y="400" font-size="12" fill="#34495e" font-weight="bold">Best regards,</text>
  <line x1="80" y1="415" x2="220" y2="415" stroke="#ccc" stroke-width="0.5"/>
  <text x="80" y="432" font-size="10" fill="#95a5a6">Your first name</text>
  <text x="350" y="465" text-anchor="middle" font-size="10" fill="#bdc3c7">IELTS General Training Writing Task 1 - Semi-formal Letter</text>
</svg>
