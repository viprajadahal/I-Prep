<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="url(#bg)" rx="8"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Changes at West Park School</text>
  <text x="350" y="48" text-anchor="middle" font-size="12" fill="#666">Comparison: 1950 vs 2010</text>
  <rect x="20" y="65" width="330" height="340" fill="#f0f7e6" stroke="#8bc34a" stroke-width="1.5" rx="6"/>
  <text x="185" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">1950</text>
  <rect x="50" y="100" width="100" height="60" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1" rx="4"/>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">Main School</text>
  <text x="100" y="142" text-anchor="middle" font-size="9" fill="#2e7d32">(Building)</text>
  <rect x="200" y="100" width="100" height="60" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="4"/>
  <text x="250" y="128" text-anchor="middle" font-size="10" fill="#388e3c" font-weight="bold">Playground</text>
  <text x="250" y="142" text-anchor="middle" font-size="9" fill="#388e3c">(Open field)</text>
  <rect x="50" y="180" width="250" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="4"/>
  <text x="175" y="205" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">Car Park (Small, 10 spaces)</text>
  <rect x="50" y="240" width="120" height="50" fill="#fff9c4" stroke="#f9a825" stroke-width="1" rx="4"/>
  <text x="110" y="265" text-anchor="middle" font-size="10" fill="#f9a825" font-weight="bold">Garden</text>
  <text x="110" y="278" text-anchor="middle" font-size="9" fill="#f9a825">(Vegetables)</text>
  <rect x="200" y="240" width="100" height="50" fill="#ffccbc" stroke="#e64a19" stroke-width="1" rx="4"/>
  <text x="250" y="265" text-anchor="middle" font-size="10" fill="#e64a19" font-weight="bold">Library</text>
  <text x="250" y="278" text-anchor="middle" font-size="9" fill="#e64a19">(Small room)</text>
  <line x1="50" y1="310" x2="300" y2="310" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
  <text x="175" y="325" text-anchor="middle" font-size="10" fill="#795548" font-weight="bold">Main Road</text>
  <text x="185" y="370" text-anchor="middle" font-size="10" fill="#666">Students: 200</text>
  <text x="185" y="385" text-anchor="middle" font-size="10" fill="#666">No sports facilities</text>
  <rect x="355" y="65" width="330" height="340" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" rx="6"/>
  <text x="520" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">2010</text>
  <rect x="380" y="100" width="130" height="70" fill="#90caf9" stroke="#1565c0" stroke-width="1" rx="4"/>
  <text x="445" y="125" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">Main School</text>
  <text x="445" y="140" text-anchor="middle" font-size="9" fill="#1565c0">(Extended, 2 floors)</text>
  <text x="445" y="155" text-anchor="middle" font-size="9" fill="#1565c0">+ New Block</text>
  <rect x="530" y="100" width="120" height="70" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="4"/>
  <text x="590" y="125" text-anchor="middle" font-size="10" fill="#388e3c" font-weight="bold">Sports Hall</text>
  <text x="590" y="140" text-anchor="middle" font-size="9" fill="#388e3c">(New building)</text>
  <text x="590" y="155" text-anchor="middle" font-size="9" fill="#388e3c">Indoor courts</text>
  <rect x="380" y="185" width="270" height="45" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="4"/>
  <text x="515" y="212" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">Car Park (Expanded, 50 spaces)</text>
  <rect x="380" y="245" width="120" height="50" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="4"/>
  <text x="440" y="270" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">Playground</text>
  <text x="440" y="283" text-anchor="middle" font-size="9" fill="#2e7d32">(Resurfaced)</text>
  <rect x="520" y="245" width="130" height="50" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" rx="4"/>
  <text x="585" y="270" text-anchor="middle" font-size="10" fill="#7b1fa2" font-weight="bold">New Library</text>
  <text x="585" y="283" text-anchor="middle" font-size="9" fill="#7b1fa2">(Modern, 2 floors)</text>
  <rect x="380" y="310" width="270" height="35" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" rx="4"/>
  <text x="515" y="332" text-anchor="middle" font-size="10" fill="#ef6c00" font-weight="bold">Cafeteria (New)</text>
  <line x1="380" y1="365" x2="650" y2="365" stroke="#795548" stroke-width="5" stroke-linecap="round"/>
  <text x="515" y="380" text-anchor="middle" font-size="10" fill="#795548" font-weight="bold">Main Road (Widened)</text>
  <text x="520" y="405" text-anchor="middle" font-size="10" fill="#666">Students: 900</text>
  <text x="520" y="420" text-anchor="middle" font-size="10" fill="#666">Sports hall + cafeteria added</text>
  <text x="350" y="468" text-anchor="middle" font-size="10" fill="#999">IELTS Academic Writing Task 1 - Map</text>
</svg>
