<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe"/>
      <stop offset="100%" style="stop-color:#f5f8fa"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="url(#bg)" rx="8"/>
  <rect x="40" y="20" width="620" height="440" fill="white" stroke="#b0c4d8" stroke-width="1.5" rx="4"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50" letter-spacing="1">INFORMAL LETTER FORMAT</text>
  <line x1="80" y1="55" x2="620" y2="55" stroke="#b0c4d8" stroke-width="0.5"/>
  <text x="80" y="80" font-size="11" fill="#7f8c8d">Your Address (optional)</text>
  <text x="80" y="95" font-size="10" fill="#95a5a6">45 Oak Avenue, Manchester</text>
  <text x="520" y="80" font-size="11" fill="#7f8c8d" text-anchor="end">Date</text>
  <text x="520" y="95" font-size="10" fill="#95a5a6" text-anchor="end">15 July 2026</text>
  <text x="80" y="130" font-size="12" fill="#2c3e50" font-weight="bold">Hi [Friend's Name]!</text>
  <rect x="80" y="150" width="540" height="50" fill="#e8f5f0" stroke="#6ab58a" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="170" font-size="11" fill="#2a7a4a" font-style="italic">Opening: Casual greeting, show warmth</text>
  <text x="95" y="187" font-size="10" fill="#3a8a5a" font-style="italic">e.g., "How are you?" / "It's been ages!" / "Hope you're well!"</text>
  <rect x="80" y="210" width="540" height="80" fill="#f5f0f8" stroke="#a86ab5" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="230" font-size="11" fill="#6a2a7a" font-style="italic">Body: Conversational tone, share news/stories</text>
  <text x="95" y="247" font-size="11" fill="#6a2a7a" font-style="italic">Use contractions: "I'm", "you'll", "don't", "can't"</text>
  <text x="95" y="264" font-size="11" fill="#6a2a7a" font-style="italic">Colloquial phrases: "By the way," / "Guess what?" / "Actually,"</text>
  <text x="95" y="281" font-size="11" fill="#6a2a7a" font-style="italic">"You won't believe..." / "I was thinking..."</text>
  <rect x="80" y="300" width="540" height="55" fill="#f8f5e8" stroke="#b5a86a" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="320" font-size="11" fill="#7a6a2a" font-style="italic">Closing: Friendly, mention future contact</text>
  <text x="95" y="337" font-size="10" fill="#8a7a3a" font-style="italic">e.g., "Write back soon!" / "Can't wait to see you!" / "Love,"</text>
  <text x="80" y="375" font-size="12" fill="#2c3e50" font-weight="bold">Cheers,</text>
  <line x1="80" y1="390" x2="180" y2="390" stroke="#ccc" stroke-width="0.5"/>
  <text x="80" y="407" font-size="10" fill="#95a5a6">Your first name</text>
  <rect x="80" y="420" width="540" height="28" fill="#fff3e0" stroke="#ffb74d" stroke-width="0.5" rx="2"/>
  <text x="350" y="438" text-anchor="middle" font-size="10" fill="#e65100" font-weight="bold">Tip: Use informal vocabulary but maintain readability for IELTS markers</text>
  <text x="350" y="465" text-anchor="middle" font-size="10" fill="#bdc3c7">IELTS General Training Writing Task 1 - Informal Letter</text>
</svg>
