<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="url(#bg)" rx="8"/>
  <text x="350" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Energy Consumption by Source in Five Countries (2022)</text>
  <rect x="70" y="60" width="560" height="380" fill="white" stroke="#e0e0e0" stroke-width="1" rx="4"/>
  <rect x="70" y="60" width="560" height="45" fill="#4c6ef5" rx="4"/>
  <rect x="70" y="97" width="560" height="3" fill="#4c6ef5"/>
  <text x="160" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Country</text>
  <text x="310" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Oil</text>
  <text x="400" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Gas</text>
  <text x="490" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Coal</text>
  <text x="580" y="88" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Renewable</text>
  <rect x="70" y="110" width="560" height="40" fill="#f8f9fa"/>
  <text x="160" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">USA</text>
  <text x="310" y="135" text-anchor="middle" font-size="13" fill="#333">35.2</text>
  <text x="400" y="135" text-anchor="middle" font-size="13" fill="#333">28.4</text>
  <text x="490" y="135" text-anchor="middle" font-size="13" fill="#333">10.1</text>
  <text x="580" y="135" text-anchor="middle" font-size="13" fill="#333">26.3</text>
  <rect x="70" y="150" width="560" height="40" fill="white"/>
  <text x="160" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">China</text>
  <text x="310" y="175" text-anchor="middle" font-size="13" fill="#333">18.5</text>
  <text x="400" y="175" text-anchor="middle" font-size="13" fill="#333">8.2</text>
  <text x="490" y="175" text-anchor="middle" font-size="13" fill="#333">55.3</text>
  <text x="580" y="175" text-anchor="middle" font-size="13" fill="#333">18.0</text>
  <rect x="70" y="190" width="560" height="40" fill="#f8f9fa"/>
  <text x="160" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">UK</text>
  <text x="310" y="215" text-anchor="middle" font-size="13" fill="#333">28.1</text>
  <text x="400" y="215" text-anchor="middle" font-size="13" fill="#333">34.5</text>
  <text x="490" y="215" text-anchor="middle" font-size="13" fill="#333">5.2</text>
  <text x="580" y="215" text-anchor="middle" font-size="13" fill="#333">32.2</text>
  <rect x="70" y="230" width="560" height="40" fill="white"/>
  <text x="160" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">India</text>
  <text x="310" y="255" text-anchor="middle" font-size="13" fill="#333">22.3</text>
  <text x="400" y="255" text-anchor="middle" font-size="13" fill="#333">6.1</text>
  <text x="490" y="255" text-anchor="middle" font-size="13" fill="#333">44.8</text>
  <text x="580" y="255" text-anchor="middle" font-size="13" fill="#333">26.8</text>
  <rect x="70" y="270" width="560" height="40" fill="#f8f9fa"/>
  <text x="160" y="295" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Germany</text>
  <text x="310" y="295" text-anchor="middle" font-size="13" fill="#333">30.4</text>
  <text x="400" y="295" text-anchor="middle" font-size="13" fill="#333">22.8</text>
  <text x="490" y="295" text-anchor="middle" font-size="13" fill="#333">16.2</text>
  <text x="580" y="295" text-anchor="middle" font-size="13" fill="#333">30.6</text>
  <text x="160" y="350" text-anchor="middle" font-size="11" fill="#666">Country</text>
  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#666">Oil (Mtoe)</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#666">Gas (Mtoe)</text>
  <text x="490" y="350" text-anchor="middle" font-size="11" fill="#666">Coal (Mtoe)</text>
  <text x="580" y="350" text-anchor="middle" font-size="11" fill="#666">Renewable (Mtoe)</text>
  <text x="160" y="380" text-anchor="middle" font-size="12" fill="#666">= Million tonnes of oil equivalent</text>
  <text x="350" y="430" text-anchor="middle" font-size="11" fill="#666">Note: Figures are rounded to one decimal place.</text>
  <text x="350" y="460" text-anchor="middle" font-size="10" fill="#999">Source: International Energy Agency, 2022</text>
</svg>
