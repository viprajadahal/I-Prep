<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe"/>
      <stop offset="100%" style="stop-color:#f9f7f4"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="url(#bg)" rx="8"/>
  <rect x="40" y="20" width="620" height="440" fill="white" stroke="#d4c5a9" stroke-width="1.5" rx="4"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50" letter-spacing="1">FORMAL LETTER FORMAT</text>
  <line x1="80" y1="55" x2="620" y2="55" stroke="#d4c5a9" stroke-width="0.5"/>
  <text x="80" y="80" font-size="11" fill="#7f8c8d">Sender's Address</text>
  <text x="80" y="95" font-size="10" fill="#95a5a6">123 Main Street, London, SW1A 1AA</text>
  <text x="520" y="80" font-size="11" fill="#7f8c8d" text-anchor="end">Date</text>
  <text x="520" y="95" font-size="10" fill="#95a5a6" text-anchor="end">15 July 2026</text>
  <text x="80" y="125" font-size="11" fill="#7f8c8d">Recipient's Address</text>
  <text x="80" y="140" font-size="10" fill="#95a5a6">The Manager, ABC Company, 45 Park Lane, London</text>
  <text x="80" y="175" font-size="12" fill="#2c3e50" font-weight="bold">Dear Sir/Madam,</text>
  <rect x="80" y="195" width="540" height="50" fill="#f0f4e8" stroke="#a8c686" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="215" font-size="11" fill="#5a7a3a" font-style="italic">Opening paragraph: State the purpose of writing clearly</text>
  <text x="95" y="232" font-size="10" fill="#7a9a5a" font-style="italic">e.g., "I am writing to request..." / "I am writing regarding..."</text>
  <rect x="80" y="255" width="540" height="65" fill="#e8f0f8" stroke="#7aa8cc" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="275" font-size="11" fill="#3a6a9a" font-style="italic">Body paragraph(s): Provide details, reasons, and supporting</text>
  <text x="95" y="292" font-size="11" fill="#3a6a9a" font-style="italic">information. Use formal linking words: "Furthermore," "Moreover,"</text>
  <text x="95" y="309" font-size="11" fill="#3a6a9a" font-style="italic">"In addition," "Consequently,"</text>
  <rect x="80" y="330" width="540" height="45" fill="#f8f0e8" stroke="#cc9a6a" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="95" y="350" font-size="11" fill="#8a5a2a" font-style="italic">Closing paragraph: State desired action or express hope</text>
  <text x="95" y="367" font-size="10" fill="#9a6a3a" font-style="italic">e.g., "I look forward to hearing from you" / "I await your response"</text>
  <text x="80" y="400" font-size="12" fill="#2c3e50" font-weight="bold">Yours faithfully,</text>
  <line x1="80" y1="415" x2="220" y2="415" stroke="#ccc" stroke-width="0.5"/>
  <text x="80" y="432" font-size="10" fill="#95a5a6">Your full name</text>
  <text x="350" y="465" text-anchor="middle" font-size="10" fill="#bdc3c7">IELTS General Training Writing Task 1 - Formal Letter</text>
</svg>
